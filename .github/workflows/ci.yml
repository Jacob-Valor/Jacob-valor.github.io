name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run ci:check

      - name: Type check
        run: bun run typecheck

      # Fails on dead internal links and anchors (rspress.config.ts `markdown.link`).
      - name: Build
        run: bun run build

  # Merges minor/patch Dependabot PRs once `check` passes, then deploys.
  # A merge made with GITHUB_TOKEN does not fire `push` workflows,
  # so the deploy is started explicitly via workflow_dispatch.
  dependabot-merge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge and deploy
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          gh pr merge "$PR_URL" --squash --delete-branch
          gh workflow run deploy.yml --repo "$REPO" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
