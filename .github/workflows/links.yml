name: External links

# External sites flake, so this runs on a schedule instead of blocking PRs.
# Internal links and anchors are checked by the build in CI.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --exclude-path docs/public --scheme https --scheme http 'docs/**/*.md' 'docs/**/*.mdx' README.md
          fail: false

      - name: Open issue on broken links
        if: steps.lychee.outputs.exit_code != 0
        run: gh issue create --repo "$REPO" --title "Broken external links ($(date -u +%F))" --body-file lychee/out.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
